apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/ssprint0
  - ssprint0-config.yaml
  - ssprint0-sealedsecret.yaml
  - ssprint0-httpscaledobject.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: ssprint0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ssprint0
images:
  - name: ssprint0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-skill-sprint
    digest: sha256:30f088c330858d6735de2536623769cbb5d167add9a525c320e1d3836d22e755
