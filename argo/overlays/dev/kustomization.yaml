apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../services/ssprint0
  - ssprint0-config.yaml
  - ssprint0-sealedsecret.yaml
  - ssprint0-httpscaledobject.yaml
  - ssprint0-interceptor-ingress.yaml
patches:
  # Drop the direct ALB Ingress: dev is fronted through the KEDA interceptor.
  - target:
      kind: Ingress
      name: ssprint0
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: ssprint0
images:
  - name: ssprint0
    newName: 368076259134.dkr.ecr.us-east-1.amazonaws.com/sdk-example
    newTag: sdk-skill-sprint
    digest: sha256:51542baf0d6648a48f94c0ecee675074edf84d26470caf904fd9702d071bc878
